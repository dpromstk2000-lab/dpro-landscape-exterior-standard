<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPRO 造園・外構｜First10 Tutorial V1.1</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans JP',sans-serif;background:#eef4f1;color:#17382e}.head{background:#08392d;color:#fff;padding:16px 20px}.wrap{max-width:920px;margin:28px auto;padding:0 18px}.hero,.panel{background:#fff;border:1px solid #d1dfda;border-radius:20px;padding:24px}.hero{margin-bottom:18px}.btn{min-height:46px;border-radius:999px;padding:0 18px;border:1px solid #acc4bb;background:#fff;font-weight:800;margin:4px}.primary{background:#0f8066;color:#fff}.progress{height:9px;background:#e2ece8;border-radius:99px;overflow:hidden}.bar{height:100%;background:#149171;width:10%}.panel h2{font-size:28px}.controls{display:flex;justify-content:space-between;margin-top:18px}.drag{display:inline-block;padding:7px 12px;border-radius:9px;background:#edf7f3;cursor:grab;margin-bottom:12px}.links a{display:inline-flex;min-height:44px;align-items:center;color:#0d6f58;font-weight:800;margin-right:12px}</style></head><body><header class="head"><b>DPRO 造園・外構 / TUTORIAL STANDARD V1.1</b></header><main class="wrap"><section class="hero"><div style="font-size:11px;color:#13846a;font-weight:900;letter-spacing:.14em">FIRST10 / EXACTLY 10</div><h1>最初の10操作だけ、順番に確認。</h1><p>説明レイヤーだけを動かします。業務データの自動送信・自動承認・自動削除・Demo Prepare自動実行はしません。</p><p><button id="start" class="btn primary">Start</button><button id="resume" class="btn">Resume</button><button id="replay" class="btn">Replay</button></p><div class="links"><a href="guide-center.html">Guide Center</a><a href="../../">デモへ戻る</a></div></section><section id="panel" class="panel" hidden tabindex="-1"><div id="drag" class="drag">↕ Tutorial card</div><div class="progress"><div id="bar" class="bar"></div></div><p id="stepnum" style="font-weight:900;color:#13846a"></p><h2 id="title"></h2><p id="body"></p><div class="controls"><button id="close" class="btn">Close</button><span><button id="back" class="btn">Back</button><button id="next" class="btn primary">Next</button></span></div></section></main><script>const STEPS=[['T01','Guide Centerを開く','困った時の入口を先に確認します。'],['T02','Publicデモを確認','相談から案件へつながる入口を確認します。'],['T03','Ownerで案件一覧を見る','案件全体と次のアクションを確認します。'],['T04','現調・写真ポイントを見る','施工箇所ごとの写真と現調項目を確認します。'],['T05','見積根拠を確認','現調・写真と見積のつながりを確認します。'],['T06','Staffの担当案件を見る','現場担当者の画面と権限範囲を確認します。'],['T07','After写真の導線を見る','担当案件から施工後写真の登録導線を確認します。'],['T08','CustomerのBefore→Afterを見る','自分の案件だけが見えることを確認します。'],['T09','完了承認の流れを見る','Customer確認とOwnerの完了状態を確認します。'],['T10','System Checkを確認','営業前チェックを確認し、完了後Replayします。']];const KEY='dpro_landscape_first10_v11_preview';let i=0;const p=document.getElementById('panel'),bar=document.getElementById('bar'),sn=document.getElementById('stepnum'),ti=document.getElementById('title'),bo=document.getElementById('body');function save(done=false){localStorage.setItem(KEY,JSON.stringify({step:i,done}))}function state(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function render(){const s=STEPS[i];sn.textContent=s[0]+' / 10';ti.textContent=s[1];bo.textContent=s[2];bar.style.width=((i+1)*10)+'%';back.disabled=i===0;next.textContent=i===9?'Complete':'Next';p.hidden=false;p.focus()}function start(){i=0;save();render()}function resume(){i=Math.max(0,Math.min(9,state().step||0));render()}function replay(){i=0;save();render()}function forward(){if(i<9){i++;save();render()}else{save(true);p.hidden=true}}function backward(){if(i>0){i--;save();render()}}function closeIt(){save();p.hidden=true}document.getElementById('start').onclick=start;document.getElementById('resume').onclick=resume;document.getElementById('replay').onclick=replay;document.getElementById('next').onclick=forward;document.getElementById('back').onclick=backward;document.getElementById('close').onclick=closeIt;addEventListener('keydown',e=>{if(e.key==='Escape')closeIt();if(!p.hidden&&e.key==='ArrowRight')forward();if(!p.hidden&&e.key==='ArrowLeft')backward()});let dragging=false,px=0,py=0,ox=0,oy=0;const d=document.getElementById('drag');d.addEventListener('pointerdown',e=>{dragging=true;d.setPointerCapture(e.pointerId);px=e.clientX;py=e.clientY});d.addEventListener('pointermove',e=>{if(!dragging)return;ox+=e.movementX;oy+=e.movementY;const r=p.getBoundingClientRect();ox=Math.max(-r.left,Math.min(innerWidth-r.right+ox,ox));oy=Math.max(-r.top,Math.min(innerHeight-r.bottom+oy,oy));p.style.transform=`translate(${ox}px,${oy}px)`});d.addEventListener('pointerup',()=>dragging=false)</script></body></html>
