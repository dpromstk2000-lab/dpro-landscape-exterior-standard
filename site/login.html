<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン｜DPRO 造園・外構</title><link rel="stylesheet" href="app.css"><script src="config.js"></script></head><body>
<header class="topbar"><div class="brand">DPRO 造園・外構 <span class="badge">SECURE LOGIN</span></div></header>
<main class="wrap"><section class="card" style="max-width:520px;margin:48px auto"><h1>ログイン</h1><p class="muted">Owner / Staff / Customer の権限はサーバー側で判定されます。</p><form id="f"><label for="loginEmail">メールアドレス</label><input id="loginEmail" name="email" type="email" autocomplete="username" required><label for="loginPassword">パスワード</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><div class="row" style="margin-top:16px"><button>ログイン</button></div><div id="out" hidden aria-live="polite"></div></form></section></main>
<script type="module">import{signInWithPassword}from'./auth-client.js';const f=document.querySelector('#f'),o=document.querySelector('#out');if(window.DPRO_LANDSCAPE_CONFIG?.demo){location.href='owner.html'}f.onsubmit=async e=>{e.preventDefault();o.hidden=true;try{await signInWithPassword(f.email.value,f.password.value);const p=new URLSearchParams(location.search);const next=p.get('next')||'owner.html';location.href=/^[a-z0-9_.?=&%-]+$/i.test(next)?next:'owner.html'}catch(err){o.className='error';o.textContent=`ログインできません: ${err.message}`;o.hidden=false}};</script></body></html>
