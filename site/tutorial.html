<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DPRO 造園・外構 First10 Tutorial</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:#12261f}
:root{--g:#0d4435;--g2:#11775f;--mint:#e9f7f1;--line:#d5e4df;--ink:#12261f;--muted:#5b6e67;--cream:#f8f4ec;--warn:#b42318;--amber:#ffae00}
h1,h2,h3,p{margin-top:0}a{color:inherit}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#14836a;text-transform:uppercase}
.btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:10px 18px;border-radius:999px;background:var(--g2);color:#fff;text-decoration:none;font-weight:800;border:1px solid var(--g2);cursor:pointer}
.btn.alt{background:#fff;color:var(--g);border-color:#b7ccc5}.pill{display:inline-block;padding:5px 9px;border:1px solid #bad1c9;border-radius:999px;font-size:11px;font-weight:700;background:#fff}
.card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px}.small{font-size:12px;color:var(--muted);line-height:1.65}
body{background:#eef4f1;overflow-x:hidden}.top{background:#08392d;color:#fff;padding:14px 20px}.wrap{max-width:1240px;margin:24px auto;padding:0 18px}.hero{background:#fff;border-radius:22px;padding:24px;border:1px solid #d2e2dc}.actions{display:flex;gap:10px;flex-wrap:wrap}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:18px;align-items:start;margin-top:18px}.surface-card{background:#fff;border:1px solid #cbdcd5;border-radius:20px;overflow:hidden;min-width:0}.surface-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#f6faf8;border-bottom:1px solid var(--line)}.surface-head strong{font-size:13px}.route{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.surface-frame{display:block;width:100%;height:min(70vh,760px);border:0;background:#fff}
.panel{background:#fff;border:1px solid #cbdcd5;border-radius:20px;padding:18px;position:sticky;top:16px;z-index:5;box-shadow:0 12px 30px rgba(8,57,45,.08)}.progress{height:8px;background:#e4eeea;border-radius:8px;overflow:hidden}.bar{height:100%;background:#1a987a;width:10%}
.stepnum{font-weight:900;color:#14836a}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.controls span{display:flex;gap:8px}.controls button,.actions button,.recovery button{min-height:46px;border-radius:999px;border:1px solid #a9c3ba;padding:0 18px;font-weight:800;background:#fff;cursor:pointer}.primary{background:#147d65!important;color:#fff!important}.drag{cursor:grab;user-select:none;background:#edf7f3;border-radius:9px;padding:8px 12px;display:inline-block;margin-bottom:10px;touch-action:none}.drag:active{cursor:grabbing}
.target-meta{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#f4f8f6;border:1px solid #dbe8e3;font-size:12px;line-height:1.55}.target-meta code{font-size:11px;word-break:break-all}.target-status{margin-top:12px;padding:10px 12px;border-radius:12px;background:#edf8f3;border:1px solid #bee0d2;color:#0b5b49;font-weight:800;font-size:13px}.target-status.resolving{background:#fff8e6;border-color:#f2d48a;color:#725200}.target-status.missing{background:#fff1f0;border-color:#f1b7b2;color:var(--warn)}.recovery{display:none;gap:8px;flex-wrap:wrap;margin-top:10px}.recovery.show{display:flex}.recovery a{min-height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:999px;border:1px solid #b7ccc5;background:#fff;text-decoration:none;font-weight:800;font-size:13px}.safety{margin-top:10px;color:#6b5146;font-size:12px;line-height:1.6}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button:focus-visible,a:focus-visible,.drag:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
[hidden]{display:none!important}
@media(max-width:860px){.wrap{padding:0 12px;margin:14px auto}.hero{padding:18px}.workspace{grid-template-columns:1fr}.surface-frame{height:56vh;min-height:360px}.panel{position:relative;top:auto}.actions .btn,.actions button{flex:1 1 140px}.controls{align-items:center}.controls button{padding:0 14px}.target-meta{font-size:11px}}
@media(max-width:430px){.top{padding:12px 14px}.wrap{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));padding-bottom:max(10px,env(safe-area-inset-bottom))}.hero h1{font-size:1.55rem;line-height:1.25}.surface-frame{height:54vh;min-height:330px}.panel{padding:15px}.controls{flex-direction:column;align-items:stretch}.controls>button,.controls span,.controls span button{width:100%}.controls span{display:grid;grid-template-columns:1fr 1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn,.actions button{width:100%;padding:8px 10px}.drag{width:100%;text-align:center}}
</style>
</head>
<body>
<div class="top"><b>DPRO 造園・外構 - TUTORIAL NAVIGATION V1.2.2</b></div>
<main class="wrap">
<section class="hero">
  <div class="eyebrow">FIRST10 / EXACTLY 10 / ACTUAL TARGET NAVIGATION</div>
  <h1>最初の10操作だけ、実際の画面で順番に確認。</h1>
  <p>現在の画面を表示し、該当箇所まで移動して強調します。自動送信・自動承認・自動登録・Demo Prepareなどの業務変更は行いません。</p>
  <div class="actions">
    <button id="start" class="primary">Start</button>
    <button id="resume">Resume</button>
    <button id="replay">Replay</button>
    <a class="btn alt" href="index.html">デモへ戻る</a>
    <a class="btn alt" href="guide-center.html">Guide Center</a>
  </div>
</section>
<section id="workspace" class="workspace" hidden>
  <div class="surface-card">
    <div class="surface-head"><strong id="surfaceLabel">Current screen</strong><span id="routeLabel" class="route"></span></div>
    <iframe id="surface" class="surface-frame" title="First10 対象画面"></iframe>
  </div>
  <section id="panel" class="panel" tabindex="-1" aria-live="polite">
    <div id="drag" class="drag" tabindex="0" aria-label="チュートリアルカードを移動">↕ Tutorial card</div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <p class="stepnum" id="stepnum"></p>
    <h2 id="title"></h2>
    <p id="body"></p>
    <div class="target-meta"><div><strong>画面:</strong> <code id="targetRoute"></code></div><div><strong>対象:</strong> <code id="targetSelector"></code></div></div>
    <div id="targetStatus" class="target-status resolving" role="status">対象画面を確認しています…</div>
    <p id="safety" class="safety"></p>
    <div id="recovery" class="recovery"><button id="retry">Retry</button><a id="guideRecovery" href="guide-center.html">Guide Centerで復旧</a></div>
    <div class="controls"><button id="close">Close</button><span><button id="back">Back</button><button id="next" class="primary" disabled>Next</button></span></div>
  </section>
</section>
<p id="announce" class="sr-only" aria-live="assertive"></p>
</main>
<script>
const VERSION='DPRO_TUTORIAL_NAVIGATION_V1.2.2';
const KEY='dpro_landscape_first10_v11';
const TARGET_TIMEOUT_MS=15000;
const STEPS=[
{step_id:'landscape-first10-01-guide-center',id:'T01',order:1,title:'Guide Centerを開く',role_or_surface:'guide',target_page_or_route:'guide-center.html',target_selector:'#startFirst10',body:'困った時の入口とFirst10の開始位置を確認します。',safety_note:'リンク位置を確認するだけで、業務データは変更しません。',target_required:true},
{step_id:'landscape-first10-02-public-demo',id:'T02',order:2,title:'Publicデモを確認',role_or_surface:'public',target_page_or_route:'index.html',target_selector:'#inquiry',body:'写真相談から案件につながる公開入口を確認します。',safety_note:'相談フォームは送信しません。',target_required:true},
{step_id:'landscape-first10-03-owner-cases',id:'T03',order:3,title:'Ownerで案件一覧を見る',role_or_surface:'owner',target_page_or_route:'owner.html',target_selector:'#cases',body:'Ownerの案件一覧と次のアクションを確認します。',safety_note:'案件を閲覧するだけで、Demo Prepareは実行しません。',target_required:true},
{step_id:'landscape-first10-04-owner-photo-points',id:'T04',order:4,title:'現調・写真ポイントを見る',role_or_surface:'owner',target_page_or_route:'owner.html',target_selector:'#detail > h3:nth-of-type(2)',body:'現場カルテ内の写真ポイントを確認します。',safety_note:'現在表示された案件の写真ポイント位置を確認します。',target_required:true,dynamic_target:true},
{step_id:'landscape-first10-05-owner-estimate',id:'T05',order:5,title:'見積根拠を確認',role_or_surface:'owner',target_page_or_route:'owner.html',target_selector:'#detail > h3:nth-of-type(3)',body:'現調・写真から見積へつながる位置を確認します。',safety_note:'見積表示を確認するだけで、保存操作は行いません。',target_required:true,dynamic_target:true},
{step_id:'landscape-first10-06-staff-cases',id:'T06',order:6,title:'Staffの担当案件を見る',role_or_surface:'staff',target_page_or_route:'staff.html',target_selector:'#cases',body:'Staffに割り当てられた担当案件の入口を確認します。',safety_note:'担当案件を表示するだけで、進捗や完了状態は変更しません。',target_required:true},
{step_id:'landscape-first10-07-after-photo',id:'T07',order:7,title:'After写真の導線を見る',role_or_surface:'staff',target_page_or_route:'staff.html',target_selector:'.add-after-demo',body:'After写真を登録する現在の導線だけを確認します。',safety_note:'After写真登録ボタンは強調するだけで、絶対に自動クリック・アップロード・POSTしません。',target_required:true,dynamic_target:true},
{step_id:'landscape-first10-08-customer-before-after',id:'T08',order:8,title:'CustomerのBefore→Afterを見る',role_or_surface:'customer',target_page_or_route:'customer.html',target_selector:'#content article:nth-child(2) > h2',body:'Customerに共有されたBefore→After表示を確認します。',safety_note:'表示確認のみで、Customer回答は送信しません。',target_required:true,dynamic_target:true},
{step_id:'landscape-first10-09-customer-approval',id:'T09',order:9,title:'完了承認の流れを見る',role_or_surface:'customer',target_page_or_route:'customer.html',target_selector:'#approval',body:'Customerの完了確認・承認領域を確認します。',safety_note:'完了承認・手直し依頼は強調するだけで、自動クリック・POSTしません。',target_required:true,dynamic_target:true},
{step_id:'landscape-first10-10-system-check',id:'T10',order:10,title:'System Checkを確認',role_or_surface:'system_check',target_page_or_route:'system-check.html',target_selector:'#run',body:'営業前 / デプロイ前の一括チェック入口を確認します。',safety_note:'一括チェック入口を確認します。Demo Prepareは実行しません。ページ読込時のread-only System Checkは許容されます。',target_required:true}
];
let idx=0,dragging=false,px=0,py=0,ox=0,oy=0,resolveToken=0,targetState='idle',lastEvidence=null,forcedSelector=null;
const workspace=document.getElementById('workspace'),p=document.getElementById('panel'),frame=document.getElementById('surface'),bar=document.getElementById('bar'),sn=document.getElementById('stepnum'),ti=document.getElementById('title'),bo=document.getElementById('body'),statusEl=document.getElementById('targetStatus'),recovery=document.getElementById('recovery'),nextBtn=document.getElementById('next'),routeLabel=document.getElementById('routeLabel'),targetRoute=document.getElementById('targetRoute'),targetSelector=document.getElementById('targetSelector'),safety=document.getElementById('safety'),announce=document.getElementById('announce');
function state(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return window.__dproTutorialState||{}}}
function save(done=false){const s=STEPS[idx];const payload={step:idx,done,version:VERSION,route:s?.target_page_or_route||'',selector:s?.target_selector||'',saved_at:new Date().toISOString()};try{localStorage.setItem(KEY,JSON.stringify(payload))}catch(e){window.__dproTutorialState=payload}return payload}
function setStatus(kind,text){targetState=kind;statusEl.className='target-status '+kind;statusEl.textContent=text;announce.textContent=text;const found=kind==='found';nextBtn.disabled=!found;recovery.classList.toggle('show',kind==='missing');p.dataset.targetStatus=kind}
function clearHighlight(){try{const doc=frame.contentDocument;if(!doc)return;doc.querySelectorAll('.dpro-tutorial-v122-target').forEach(el=>el.classList.remove('dpro-tutorial-v122-target'));}catch(e){}}
function injectHighlightStyle(doc){if(doc.getElementById('dpro-tutorial-v122-style'))return;const st=doc.createElement('style');st.id='dpro-tutorial-v122-style';st.textContent='.dpro-tutorial-v122-target{outline:4px solid #ffae00!important;outline-offset:4px!important;box-shadow:0 0 0 8px rgba(255,174,0,.22)!important;scroll-margin:80px!important;position:relative!important;z-index:2147483000!important}';doc.head.appendChild(st)}
function currentRoute(){try{return new URL(frame.contentWindow.location.href).pathname.split('/').pop()||'index.html'}catch(e){return ''}}
function visible(el){const r=el.getBoundingClientRect(),cs=el.ownerDocument.defaultView.getComputedStyle(el);return r.width>0&&r.height>0&&cs.display!=='none'&&cs.visibility!=='hidden'}
function delay(ms){return new Promise(r=>setTimeout(r,ms))}
async function waitFrameLoad(expected,token){const started=Date.now();while(Date.now()-started<TARGET_TIMEOUT_MS){if(token!==resolveToken)return false;try{const d=frame.contentDocument;if(d&&d.readyState==='complete'&&currentRoute()===expected)return true}catch(e){}await delay(120)}return false}
async function waitTarget(selector,token){const started=Date.now();while(Date.now()-started<TARGET_TIMEOUT_MS){if(token!==resolveToken)return null;try{const d=frame.contentDocument,el=d?.querySelector(selector);if(el&&visible(el))return el}catch(e){}await delay(150)}return null}
async function resolveCurrentTarget({forceReload=false}={}){const token=++resolveToken,s=STEPS[idx],selector=forcedSelector||s.target_selector;clearHighlight();setStatus('resolving','対象画面を確認しています…');targetRoute.textContent=s.target_page_or_route;targetSelector.textContent=selector;routeLabel.textContent=s.target_page_or_route;document.getElementById('surfaceLabel').textContent=`${s.order}. ${s.role_or_surface}`;
  let route=currentRoute();
  if(forceReload||route!==s.target_page_or_route){frame.src=s.target_page_or_route;const loaded=await waitFrameLoad(s.target_page_or_route,token);if(!loaded){return targetMissing('WRONG_ROUTE_OR_LOAD_TIMEOUT',s,selector)}}
  else{try{if(frame.contentDocument?.readyState!=='complete')await waitFrameLoad(s.target_page_or_route,token)}catch(e){}}
  if(token!==resolveToken)return;
  if(currentRoute()!==s.target_page_or_route)return targetMissing('WRONG_ROUTE',s,selector);
  const el=await waitTarget(selector,token);if(token!==resolveToken)return;if(!el)return targetMissing('TARGET_MISSING',s,selector);
  try{const doc=frame.contentDocument;injectHighlightStyle(doc);clearHighlight();el.classList.add('dpro-tutorial-v122-target');el.scrollIntoView({behavior:'auto',block:'center',inline:'nearest'});await delay(120);const r=el.getBoundingClientRect(),vw=frame.contentWindow.innerWidth,vh=frame.contentWindow.innerHeight;const inView=r.bottom>0&&r.right>0&&r.top<vh&&r.left<vw;if(!inView)return targetMissing('TARGET_NOT_VISIBLE',s,selector);lastEvidence={step_id:s.step_id,order:s.order,route:currentRoute(),selector,found:true,visible:true,rect:{x:r.x,y:r.y,width:r.width,height:r.height},ts:new Date().toISOString()};p.dataset.currentStep=String(s.order);p.dataset.currentRoute=currentRoute();p.dataset.currentSelector=selector;setStatus('found','対象画面を表示し、該当箇所を強調しました。');}catch(e){targetMissing('TARGET_HIGHLIGHT_ERROR',s,selector,String(e))}}
function targetMissing(reason,s,selector,detail=''){lastEvidence={step_id:s.step_id,order:s.order,route:currentRoute(),selector,found:false,reason,detail,ts:new Date().toISOString()};p.dataset.currentStep=String(s.order);p.dataset.currentRoute=currentRoute();p.dataset.currentSelector=selector;setStatus('missing','画面が見つかりません。進行を停止しました。Retry または Guide Center から復旧してください。');}
function render(){const s=STEPS[idx];sn.textContent=`${s.id} / 10`;ti.textContent=s.title;bo.textContent=s.body;bar.style.width=((idx+1)*10)+'%';document.getElementById('back').disabled=idx===0;nextBtn.textContent=idx===9?'Complete':'Next';safety.textContent=s.safety_note||'';workspace.hidden=false;p.hidden=false;p.style.transform='';p.focus();save(false);resolveCurrentTarget();}
function start(){idx=0;forcedSelector=null;save(false);render()}
function resume(){const s=state();idx=Math.min(9,Math.max(0,Number.isInteger(s.step)?s.step:0));forcedSelector=null;render()}
function replay(){try{localStorage.removeItem(KEY)}catch(e){window.__dproTutorialState={}}idx=0;forcedSelector=null;save(false);render()}
function next(){if(targetState!=='found')return;if(idx<9){idx++;save(false);render()}else{save(true);clearHighlight();p.hidden=true;workspace.hidden=true}}
function back(){if(idx>0){idx--;save(false);render()}}
function close(){save(false);clearHighlight();p.hidden=true;workspace.hidden=true}
document.getElementById('start').onclick=start;document.getElementById('resume').onclick=resume;document.getElementById('replay').onclick=replay;nextBtn.onclick=next;document.getElementById('back').onclick=back;document.getElementById('close').onclick=close;document.getElementById('retry').onclick=()=>resolveCurrentTarget({forceReload:true});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!p.hidden){e.preventDefault();close()}else if(!p.hidden&&e.key==='ArrowRight'&&!e.altKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();next()}else if(!p.hidden&&e.key==='ArrowLeft'&&!e.altKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();back()}});
const d=document.getElementById('drag');function clampTransform(x,y){const r=p.getBoundingClientRect();const nx=Math.max(x-r.left+8,Math.min(innerWidth-r.right+x-8,x));const ny=Math.max(y-r.top+8,Math.min(innerHeight-r.bottom+y-8,y));return[nx,ny]}
d.addEventListener('pointerdown',e=>{dragging=true;d.setPointerCapture(e.pointerId);px=e.clientX;py=e.clientY;const m=p.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);ox=m?+m[1]:0;oy=m?+m[2]:0});
d.addEventListener('pointermove',e=>{if(!dragging)return;const c=clampTransform(ox+e.clientX-px,oy+e.clientY-py);p.style.transform=`translate(${c[0]}px,${c[1]}px)`});d.addEventListener('pointerup',()=>dragging=false);d.addEventListener('pointercancel',()=>dragging=false);
window.__DPRO_TUTORIAL_V122__={version:VERSION,steps:STEPS.map(x=>({...x})),getRuntime:()=>({idx,step:idx+1,targetState,lastEvidence,state:state(),route:currentRoute(),panelHidden:p.hidden,workspaceHidden:workspace.hidden}),retry:()=>resolveCurrentTarget({forceReload:true}),openStep:n=>{idx=Math.min(9,Math.max(0,n-1));forcedSelector=null;render()},qaForceSelector:sel=>{if(new URLSearchParams(location.search).get('qa')!=='1')throw new Error('QA_MODE_REQUIRED');forcedSelector=sel;return resolveCurrentTarget({forceReload:false})},qaClearForce:()=>{forcedSelector=null;return resolveCurrentTarget({forceReload:false})}};
const mode=new URLSearchParams(location.search).get('mode');if(mode==='start')start();else if(mode==='resume')resume();else if(mode==='replay')replay();
</script>
</body>
</html>
