<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPRO 造園・外構 First10 Tutorial</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:#12261f}
:root{--g:#0d4435;--g2:#11775f;--mint:#e9f7f1;--line:#d5e4df;--ink:#12261f;--muted:#5b6e67;--cream:#f8f4ec}
h1,h2,h3,p{margin-top:0}a{color:inherit}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#14836a;text-transform:uppercase}
.btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:10px 18px;border-radius:999px;background:var(--g2);color:#fff;text-decoration:none;font-weight:800;border:1px solid var(--g2)}
.btn.alt{background:#fff;color:var(--g);border-color:#b7ccc5}.pill{display:inline-block;padding:5px 9px;border:1px solid #bad1c9;border-radius:999px;font-size:11px;font-weight:700;background:#fff}
.card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px}.small{font-size:12px;color:var(--muted);line-height:1.65}

body{background:#eef4f1}.top{background:#08392d;color:#fff;padding:14px 20px}.wrap{max-width:1050px;margin:28px auto;padding:0 18px}.hero{background:#fff;border-radius:22px;padding:28px;border:1px solid #d2e2dc}.actions{display:flex;gap:10px;flex-wrap:wrap}
.panel{margin-top:22px;background:#fff;border:1px solid #cbdcd5;border-radius:20px;padding:22px;position:relative}.progress{height:8px;background:#e4eeea;border-radius:8px;overflow:hidden}.bar{height:100%;background:#1a987a;width:10%}
.stepnum{font-weight:900;color:#14836a}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.controls button,.actions button{min-height:46px;border-radius:999px;border:1px solid #a9c3ba;padding:0 18px;font-weight:800;background:#fff}.primary{background:#147d65!important;color:#fff!important}.drag{cursor:grab;user-select:none;background:#edf7f3;border-radius:9px;padding:8px 12px;display:inline-block;margin-bottom:10px}
button:focus-visible{outline:3px solid #ffae00;outline-offset:2px}
</style></head><body>
<div class="top"><b>DPRO 造園・外構 - TUTORIAL STANDARD V1.1</b></div><main class="wrap"><section class="hero"><div class="eyebrow">FIRST10 / EXACTLY 10</div><h1>最初の10操作だけ、順番に確認。</h1><p>このチュートリアルは説明レイヤーです。自動送信・自動承認・自動削除・自動決済・Demo Prepareなどの業務変更は行いません。</p>
<div class="actions"><button id="start" class="primary">Start</button><button id="resume">Resume</button><button id="replay">Replay</button><a class="btn alt" href="https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/">デモへ戻る</a><a class="btn alt" href="https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/guide-center.html">Guide Center</a></div></section>
<section id="panel" class="panel" hidden tabindex="-1"><div id="drag" class="drag" aria-label="チュートリアルカードを移動">↕ Tutorial card</div><div class="progress"><div id="bar" class="bar"></div></div><p class="stepnum" id="stepnum"></p><h2 id="title"></h2><p id="body"></p>
<div class="controls"><button id="close">Close</button><span><button id="back">Back</button><button id="next" class="primary">Next</button></span></div></section></main>
<script>
const STEPS=[{"id": "T01", "title": "Guide Centerを開く", "body": "困った時の入口を先に確認します。"}, {"id": "T02", "title": "Publicデモを確認", "body": "相談から案件へつながる入口を確認します。"}, {"id": "T03", "title": "Ownerで案件一覧を見る", "body": "案件全体と次のアクションを確認します。"}, {"id": "T04", "title": "現調・写真ポイントを見る", "body": "施工箇所ごとの写真と現調項目を確認します。"}, {"id": "T05", "title": "見積根拠を確認", "body": "現調・写真と見積のつながりを確認します。"}, {"id": "T06", "title": "Staffの担当案件を見る", "body": "現場担当者の画面と権限範囲を確認します。"}, {"id": "T07", "title": "After写真の導線を見る", "body": "担当案件から施工後写真の登録導線を確認します。"}, {"id": "T08", "title": "CustomerのBefore→Afterを見る", "body": "自分の案件だけが見えることを確認します。"}, {"id": "T09", "title": "完了承認の流れを見る", "body": "Customer確認とOwnerの完了状態を確認します。"}, {"id": "T10", "title": "System Checkを確認", "body": "Demo/Production Guardと営業前チェックを確認し、完了後Replayします。"}]; const KEY='dpro_landscape_first10_v11'; let idx=0,dragging=false,px=0,py=0,ox=0,oy=0;
const p=document.getElementById('panel'),bar=document.getElementById('bar'),sn=document.getElementById('stepnum'),ti=document.getElementById('title'),bo=document.getElementById('body');
function state(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return window.__dproTutorialState||{}}}
function save(done=false){try{localStorage.setItem(KEY,JSON.stringify({step:idx,done}))}catch(e){window.__dproTutorialState={step:idx,done}}}
function render(){let s=STEPS[idx];sn.textContent=`${s.id} / 10`;ti.textContent=s.title;bo.textContent=s.body;bar.style.width=((idx+1)*10)+'%';document.getElementById('back').disabled=idx===0;document.getElementById('next').textContent=idx===9?'Complete':'Next';p.hidden=false;p.focus();}
function start(){idx=0;save(false);render()} function resume(){let s=state();idx=Math.min(9,Math.max(0,s.step||0));render()} function replay(){idx=0;save(false);render()}
function next(){if(idx<9){idx++;save(false);render()}else{save(true);p.hidden=true;}} function back(){if(idx>0){idx--;save(false);render()}}
function close(){save(false);p.hidden=true}
startBtn=document.getElementById('start');startBtn.onclick=start;document.getElementById('resume').onclick=resume;document.getElementById('replay').onclick=replay;document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;document.getElementById('close').onclick=close;
addEventListener('keydown',e=>{if(e.key==='Escape')close(); if(!p.hidden&&e.key==='ArrowRight')next(); if(!p.hidden&&e.key==='ArrowLeft')back();});
const d=document.getElementById('drag');function clamp(x,y){return [Math.max(-p.offsetLeft,Math.min(innerWidth-p.getBoundingClientRect().right+x,x)),Math.max(-p.offsetTop,Math.min(innerHeight-p.getBoundingClientRect().bottom+y,y))]}
d.addEventListener('pointerdown',e=>{dragging=true;d.setPointerCapture(e.pointerId);px=e.clientX;py=e.clientY;let m=p.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);ox=m?+m[1]:0;oy=m?+m[2]:0});
d.addEventListener('pointermove',e=>{if(!dragging)return;let x=ox+e.clientX-px,y=oy+e.clientY-py;let c=clamp(x,y);p.style.transform=`translate(${c[0]}px,${c[1]}px)`});
d.addEventListener('pointerup',()=>dragging=false);
</script></body></html>
