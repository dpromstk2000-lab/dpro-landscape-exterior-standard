<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer｜DPRO 造園・外構</title><link rel="stylesheet" href="app.css"><script src="config.js"></script></head><body>
<header class="topbar"><div class="brand">Customer My Page <span class="badge">自分の案件のみ</span></div><nav class="nav"><a href="index.html">相談</a><a href="owner.html">Ownerデモ</a><a href="staff.html">Staffデモ</a><a href="tutorial.html">Tutorial</a><a href="ready-center.html">READY</a><a href="guide-center.html">Guide</a></nav></header>
<main class="wrap"><section class="hero"><h1>工事の状況が、写真でわかる。</h1><p class="lead">見積・施工予定・共有された写真・完了承認を、自分の案件だけ確認できます。</p><div id="notice" hidden aria-live="polite"></div></section><section id="content" style="margin-top:16px"></section></main>
<script type="module">import{api,esc,statusLabel,money,show}from'./app-core.js';const content=document.querySelector('#content'),notice=document.querySelector('#notice');let current=null;async function load(){try{const list=await api('/cases',{role:'customer'});if(!list.cases.length){content.innerHTML='<div class="card">案件はありません。</div>';return}const d=await api(`/cases/${list.cases[0].id}`,{role:'customer'});current=d.case;render()}catch(e){show(notice,`読込エラー: ${e.message}`,'error')}}function render(){const c=current,est=(c.estimates||[]).at(-1),photos=(c.photos||[]);const before=photos.filter(p=>p.phase==='before'),after=photos.filter(p=>p.phase==='after');content.innerHTML=`<div class="grid grid-2"><article class="card"><h2>${esc(c.title)}</h2><p><span class="badge">${esc(statusLabel(c.status))}</span></p><p>${esc(c.customer_request||'')}</p><h3>施工予定</h3>${(c.schedule||[]).map(s=>`<div class="item">${esc(s.start_at)} 〜 ${esc(s.end_at)}</div>`).join('')||'<p class="muted">調整中</p>'}<h3 style="margin-top:16px">見積</h3>${est?`<div class="item"><strong>${money(est.total_yen)}</strong><br><span class="small">状態: ${esc(est.status)}</span></div>`:'<p class="muted">準備中</p>'}</article><article class="card"><h2>Before → After</h2><div class="grid grid-2"><div><h3>Before</h3><div class="photos">${before.map(p=>`<img src="${esc(p.url)}" alt="${esc(p.caption||'施工前')}">`).join('')||'<span class="muted">未共有</span>'}</div></div><div><h3>After</h3><div class="photos">${after.map(p=>`<img src="${esc(p.url)}" alt="${esc(p.caption||'施工後')}">`).join('')||'<span class="muted">施工後写真待ち</span>'}</div></div></div><h3 style="margin-top:16px">完了確認</h3><div id="approval"></div></article></div>`;renderApproval()}function renderApproval(){const a=current.completion,out=document.querySelector('#approval');if(!a||a.status==='draft'){out.innerHTML='<div class="notice">施工後写真と最終確認が完了すると、ここから承認できます。</div>';return}if(a.status==='pending'){out.innerHTML='<p>施工内容をご確認ください。</p><div class="row"><button id="approve">完了承認</button><button id="return" class="secondary">手直しを依頼</button></div><div id="result" hidden></div>';out.querySelector('#approve').onclick=()=>respond('approved');out.querySelector('#return').onclick=()=>respond('returned');return}out.innerHTML=`<div class="success">回答済み: ${esc(a.status)}</div>`}async function respond(decision){const r=document.querySelector('#result');try{const d=await api(`/cases/${current.id}/completion/respond`,{method:'POST',role:'customer',body:{decision,note:decision==='approved'?'確認しました。':''}});current.status=d.case.status;current.completion=d.approval;show(r,decision==='approved'?'完了承認しました。ありがとうございました。':'手直し依頼を送信しました。');render()}catch(e){show(r,`送信失敗: ${e.message}`,'error')}}load();</script></body></html>
