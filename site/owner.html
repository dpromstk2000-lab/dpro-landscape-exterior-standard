<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner｜DPRO 造園・外構</title><link rel="stylesheet" href="app.css"><script src="config.js"></script></head><body>
<header class="topbar"><div class="brand">Owner Console <span class="badge" id="modeBadge">MODE</span></div><nav class="nav"><a href="index.html">Public</a><a href="customer.html">Customer</a><a href="staff.html">Staff</a><a href="system-check.html">Check</a><a href="tutorial.html">Tutorial</a><a href="ready-center.html">READY</a><a href="guide-center.html">Guide</a></nav></header>
<main class="wrap"><section class="hero"><h1>今日やること</h1><p class="lead">新着 → 現調 → 見積 → 施工 → 完了承認 → アフターを同じ案件カルテで追います。</p><div class="row"><button id="reset">デモデータを初期化</button><button class="secondary" id="reload">再読込</button></div><div id="notice" hidden aria-live="polite"></div></section>
<section id="kpis" class="grid grid-3" style="margin-top:16px"></section><section class="grid grid-2" style="margin-top:16px"><article class="card"><h2>案件一覧</h2><div id="cases" class="list"></div></article><article class="card"><h2>現場カルテ</h2><div id="detail"><p class="muted">案件を選択してください。</p></div></article></section></main>
<script type="module">import{api,esc,statusLabel,show,money,isDemo}from'./app-core.js';document.querySelector('#modeBadge').textContent=window.DPRO_LANDSCAPE_CONFIG?.demo?'DEMO':'PRODUCTION';const casesEl=document.querySelector('#cases'),detail=document.querySelector('#detail'),notice=document.querySelector('#notice'),kpis=document.querySelector('#kpis');let rows=[];async function load(){try{const d=await api('/cases',{role:'owner'});rows=d.cases;renderList();kpis.innerHTML=`<div class="card"><div class="muted">案件</div><div class="kpi">${rows.length}</div></div><div class="card"><div class="muted">施工中</div><div class="kpi">${rows.filter(x=>x.status==='in_progress').length}</div></div><div class="card"><div class="muted">完了確認待ち</div><div class="kpi">${rows.filter(x=>x.status==='completion_review').length}</div></div>`;if(rows[0])await openCase(rows[0].id)}catch(e){show(notice,`読込エラー: ${e.message}`,'error')}}function renderList(){casesEl.innerHTML=rows.map(c=>`<button class="ghost" data-id="${esc(c.id)}" style="text-align:left;justify-content:flex-start"><span><strong>${esc(c.title)}</strong><br><span class="small status ${esc(c.status)}">${esc(statusLabel(c.status))}</span> <span class="small muted">${esc(c.next_action||'')}</span></span></button>`).join('');casesEl.querySelectorAll('button').forEach(b=>b.onclick=()=>openCase(b.dataset.id))}async function openCase(id){try{const d=await api(`/cases/${id}`,{role:'owner'});const c=d.case;const est=(c.estimates||[]).at(-1);const photoHtml=(c.photos||[]).map(p=>`<div><img src="${esc(p.url)}" alt="${esc(p.caption||p.phase)}"><div class="small">${esc(p.phase)} / ${esc(p.caption||'')}</div></div>`).join('');detail.innerHTML=`<h3>${esc(c.title)}</h3><p><span class="badge">${esc(statusLabel(c.status))}</span></p><p>${esc(c.customer_request||'')}</p><div class="notice"><strong>次:</strong> ${esc(c.next_action||'未設定')}</div><h3 style="margin-top:18px">写真ポイント</h3><div class="photos">${photoHtml||'<p class="muted">写真なし</p>'}</div><h3 style="margin-top:18px">見積</h3>${est?`<p>v${est.version_no} / ${esc(est.status)} / <strong>${money(est.total_yen)}</strong></p>`:'<p class="muted">なし</p>'}<h3>完了確認</h3><p>${esc(c.completion?.status||'未作成')}</p><h3>季節アフター</h3><div class="list">${(c.followups||[]).map(f=>`<div class="item">${esc(f.candidate_date)} ${esc(f.note)}</div>`).join('')||'<div class="muted">候補なし</div>'}</div>`}catch(e){detail.innerHTML=`<div class="error">${esc(e.message)}</div>`}}const reset=document.querySelector('#reset');if(!isDemo())reset.hidden=true;reset.onclick=async()=>{try{await api('/demo/prepare',{method:'POST',role:'owner',body:{}});show(notice,'デモデータを初期化しました。');await load()}catch(e){show(notice,`初期化失敗: ${e.message}`,'error')}};document.querySelector('#reload').onclick=load;load();</script></body></html>
