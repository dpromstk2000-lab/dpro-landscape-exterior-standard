<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Check｜DPRO 造園・外構</title><link rel="stylesheet" href="app.css"><script src="config.js"></script></head><body>
<header class="topbar"><div class="brand">System Check <span class="badge">STANDARD</span></div><nav class="nav"><a href="index.html">Public</a><a href="owner.html">Owner</a><a href="staff.html">Staff</a><a href="tutorial.html">Tutorial</a><a href="ready-center.html">READY</a><a href="guide-center.html">Guide</a></nav></header>
<main class="wrap"><section class="hero"><h1>営業前 / デプロイ前チェック</h1><p class="lead">標準製品ではDemo / Production分離、Role、Demo Prepareを一括確認します。契約後の本番System CheckはREADY手順で別途実行します。</p><div class="row"><button id="run">一括チェック</button><button id="prepare" class="secondary">Demo Prepare</button></div><div id="summary" style="margin-top:12px" hidden></div></section><section id="checks" class="list" style="margin-top:16px"></section></main>
<script type="module">import{api,esc,show}from'./app-core.js';const checks=document.querySelector('#checks'),summary=document.querySelector('#summary');async function run(){try{const d=await api('/system-check',{role:'owner'});summary.className=d.ok?'success':'error';summary.textContent=d.ok?'全blocking check PASS':'FAILがあります';summary.hidden=false;checks.innerHTML=d.checks.map(c=>`<div class="card"><strong>${esc(c.id)}</strong> <span class="badge">${esc(c.status)}</span><div class="muted small">${esc(c.detail)}</div></div>`).join('')}catch(e){show(summary,`System Check失敗: ${e.message}`,'error')}}document.querySelector('#run').onclick=run;document.querySelector('#prepare').onclick=async()=>{try{await api('/demo/prepare',{method:'POST',role:'owner',body:{}});show(summary,'Demo Prepare完了。初期データへ戻しました。');await run()}catch(e){show(summary,`Demo Prepare失敗: ${e.message}`,'error')}};run();</script></body></html>
