<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff｜DPRO 造園・外構</title><link rel="stylesheet" href="app.css"><script src="config.js"></script></head><body>
<header class="topbar"><div class="brand">Staff Mobile <span class="badge">担当現場のみ</span></div><nav class="nav"><a href="index.html">Public</a><a href="owner.html">Owner</a><a href="customer.html">Customer</a><a href="tutorial.html">Tutorial</a><a href="guide-center.html">Guide</a></nav></header>
<main class="wrap"><section class="hero"><h1>今日の担当</h1><p class="lead">現場では「確認 → 撮影 → 進捗 → 完了報告」の順に、スマホで最小入力します。</p><div id="notice" hidden aria-live="polite"></div></section><section class="grid grid-2" style="margin-top:16px"><article class="card"><h2>担当案件</h2><div id="cases" class="list"></div></article><article class="card"><h2>現場作業</h2><div id="work"><p class="muted">担当案件を選択してください。</p></div></article></section></main>
<script type="module">import{api,esc,statusLabel,show,isDemo,uploadSignedFile}from'./app-core.js';
const casesEl=document.querySelector('#cases'),work=document.querySelector('#work'),notice=document.querySelector('#notice');let current=null;
async function load(){try{const d=await api('/cases',{role:'staff'});casesEl.innerHTML=d.cases.map(c=>`<button class="ghost" data-id="${esc(c.id)}" style="justify-content:flex-start;text-align:left"><span><strong>${esc(c.title)}</strong><br><span class="small">${esc(statusLabel(c.status))}</span></span></button>`).join('');casesEl.querySelectorAll('button').forEach(b=>b.onclick=()=>openCase(b.dataset.id));if(d.cases[0])openCase(d.cases[0].id)}catch(e){show(notice,`読込エラー: ${e.message}`,'error')}}
async function openCase(id){try{const d=await api(`/cases/${id}`,{role:'staff'});current=d.case;const points=current.photo_points||[];work.innerHTML=`<h3>${esc(current.title)}</h3><p>${esc(current.customer_request||'')}</p><div class="notice"><strong>現場ステータス:</strong> ${esc(statusLabel(current.status))}</div><h3 style="margin-top:16px">写真ポイント</h3><div class="list">${points.map(p=>`<div class="item"><strong>${esc(p.name)}</strong><div class="small muted">Before必須: ${p.required_before?'はい':'いいえ'} / After必須: ${p.required_after?'はい':'いいえ'}</div>${isDemo()?`<button class="secondary add-after-demo" data-point="${esc(p.id)}" data-name="${esc(p.name)}" style="margin-top:8px">After写真をデモ登録</button>`:`<label class="btn secondary" style="margin-top:8px">After写真を撮影・選択<input class="add-after-file" data-point="${esc(p.id)}" data-name="${esc(p.name)}" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden></label>`}</div>`).join('')}</div><h3 style="margin-top:16px">進捗</h3><button id="progress">進捗100%を記録</button> <button id="submit" class="secondary">完了確認へ提出</button><div id="actionResult" hidden aria-live="polite"></div>`;
work.querySelectorAll('.add-after-demo').forEach(b=>b.onclick=()=>addAfterDemo(b.dataset.point,b.dataset.name));work.querySelectorAll('.add-after-file').forEach(i=>i.onchange=()=>i.files?.[0]&&addAfterFile(i.dataset.point,i.dataset.name,i.files[0]));work.querySelector('#progress').onclick=progress;work.querySelector('#submit').onclick=submit}catch(e){work.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function addAfterDemo(point,name){const out=work.querySelector('#actionResult');try{await api(`/cases/${current.id}/photos`,{method:'POST',role:'staff',body:{photo_point_id:point,phase:'after',url:`https://placehold.co/800x600?text=After+${encodeURIComponent(name)}`,caption:`${name} 施工後`,shared_with_customer:true}});show(out,`${name} のAfter写真を登録しました。`);await openCase(current.id)}catch(e){show(out,`登録失敗: ${e.message}`,'error')}}
async function addAfterFile(point,name,file){const out=work.querySelector('#actionResult');try{if(file.size>12582912)throw new Error('PHOTO_TOO_LARGE');show(out,'アップロードURLを準備しています。');const sign=await api(`/cases/${current.id}/photos/sign-upload`,{method:'POST',role:'staff',body:{photo_point_id:point,phase:'after',mime_type:file.type,filename:file.name}});await uploadSignedFile(sign,file);await api(`/cases/${current.id}/photos`,{method:'POST',role:'staff',body:{photo_point_id:point,phase:'after',storage_path:sign.storage_path,caption:`${name} 施工後`,shared_with_customer:true}});show(out,`${name} のAfter写真を登録しました。`);await openCase(current.id)}catch(e){show(out,`登録失敗: ${e.message}`,'error')}}
async function progress(){const out=work.querySelector('#actionResult');try{await api(`/cases/${current.id}/work-log`,{method:'POST',role:'staff',body:{progress:100,note:'施工完了。清掃・最終確認済み。'}});show(out,'進捗100%を記録しました。')}catch(e){show(out,`記録失敗: ${e.message}`,'error')}}
async function submit(){const out=work.querySelector('#actionResult');try{await api(`/cases/${current.id}/completion/submit`,{method:'POST',role:'staff',body:{}});show(out,'顧客の完了承認待ちへ進みました。');await openCase(current.id)}catch(e){const missing=e.data?.missing?.join(' / ');show(out,`提出できません: ${e.message}${missing?`（不足: ${missing}）`:''}`,'error')}}load();</script></body></html>
