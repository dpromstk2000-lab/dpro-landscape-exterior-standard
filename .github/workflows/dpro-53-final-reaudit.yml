name: DPRO 53 Final Reaudit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dpro-53-final-reaudit
  cancel-in-progress: false

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml beautifulsoup4 pypdf pymupdf pillow qrcode playwright opencv-python-headless
          python -m playwright install --with-deps chromium

      - name: Record SYSTEM Core SHA before
        run: |
          set -euo pipefail
          {
            printf '%s\n' SYSTEM_MASTER.yml schema.sql SHARED_SUPABASE_BINDING.yml AUTH_ROLE_MATRIX.yml STORAGE_INTEGRATION_CONTRACT.yml LINE_INTEGRATION_CONTRACT.yml site/app-core.js site/auth-client.js site/config.js
            find worker supabase -type f -print
          } | sort -u > /tmp/dpro53-core-paths.txt
          : > CORE_SHA_BEFORE.txt
          while IFS= read -r f; do
            test -f "$f"
            sha256sum "$f" >> CORE_SHA_BEFORE.txt
          done < /tmp/dpro53-core-paths.txt

      - name: Workflow and tool preflight
        run: |
          set -euo pipefail
          python tools/dpro53_reaudit.py validate-workflows

      - name: Prepare certified presentation files
        run: |
          set -euo pipefail
          # Certified print masters use iframes for current LIVE screens.
          # Only actual <img> elements are replaced here; live iframes remain live.
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/dpro53_reaudit.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            "patch_images(SITE/'lp.html',['landscape-hero.jpg','owner-screen.jpg','landscape-consult.jpg'])":
              "patch_images(SITE/'lp.html',['landscape-hero.jpg','landscape-consult.jpg'])",
            "patch_images(SITE/'quick-start.html',['qr-guide.svg','qr-tutorial.svg','qa-owner-screen.png','qa-system-check-screen.png','qr-system-check.svg'])":
              "patch_images(SITE/'quick-start.html',['qr-guide.svg','qr-tutorial.svg','qr-system-check.svg'])",
            "patch_images(SITE/'detailed-manual.html',['qr-guide.svg','qa-owner-screen.png','qr-tutorial.svg','qa-owner-screen.png','qa-staff-screen.png','qa-customer-screen.png','qa-system-check-screen.png','qr-system-check.svg','qr-guide.svg','qr-tutorial.svg'])":
              "patch_images(SITE/'detailed-manual.html',['qr-guide.svg','qr-tutorial.svg','qr-system-check.svg'])",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected image patch signature was not found: '+old)
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/dpro53_reaudit.py
          python tools/dpro53_reaudit.py prepare

          # The certified source masters are stored under site/presentation-v12/.
          # After copying them to the public site root, relocate only their relative links/iframes.
          python - <<'PY'
          from pathlib import Path
          fixes={
            'site/lp.html':{
              'href="../product-site.html"':'href="product-site.html"',
              'href="../official-site.html"':'href="official-site.html"',
              "previewFrame.src='../owner.html'":"previewFrame.src='owner.html'",
              'src="../" title="DPRO造園・外構 LIVE DEMO"':'src="index.html" title="DPRO造園・外構 LIVE DEMO"',
            },
            'site/guide-center.html':{
              'href="../../"':'href="index.html"',
              'href="../../customer.html"':'href="customer.html"',
              'href="../../owner.html"':'href="owner.html"',
              'href="../../staff.html"':'href="staff.html"',
              'href="../../system-check.html"':'href="system-check.html"',
            },
            'site/quick-start.html':{
              'src="../../owner.html"':'src="owner.html"',
              'src="../../system-check.html"':'src="system-check.html"',
            },
            'site/detailed-manual.html':{
              'src="../../owner.html"':'src="owner.html"',
              'src="../../staff.html"':'src="staff.html"',
              'src="../../customer.html"':'src="customer.html"',
              'src="../../system-check.html"':'src="system-check.html"',
            },
          }
          for filename,repls in fixes.items():
              p=Path(filename); s=p.read_text(encoding='utf-8')
              for old,new in repls.items():
                  if old not in s:
                      raise SystemExit(f'Expected relocation signature missing in {filename}: {old}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY

          # Fixed A4 preview pages keep their 794px print canvas, but visually scale on mobile.
          # Use a numeric CSS variable set by JS instead of the invalid length-valued scale(calc(100vw / 794)).
          python - <<'PY'
          from pathlib import Path
          files=['site/a4-flyer.html','site/quick-start.html','site/detailed-manual.html']
          script="<script>(()=>{function dproFitA4(){document.documentElement.style.setProperty('--dpro-a4-scale',String(Math.min(1,innerWidth/794)))}dproFitA4();addEventListener('resize',dproFitA4)})()</script>"
          for filename in files:
              p=Path(filename); s=p.read_text(encoding='utf-8')
              old='transform:scale(calc(100vw / 794))'
              if old not in s:
                  raise SystemExit(f'Expected fixed-A4 scale signature missing in {filename}')
              s=s.replace(old,'transform:scale(var(--dpro-a4-scale,1))')
              s=s.replace('height:calc(1123px * (100vw / 794))','height:calc(1123px * var(--dpro-a4-scale,1))')
              if script not in s:
                  s=s.replace('</body>',script+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Run FACTORY runtime QA
        run: |
          set -euo pipefail
          # The fixed A4 previews intentionally retain a 794px layout canvas while mobile CSS/JS scales
          # the rendered result. For those pages, visual heading bounds remain blocking but layout scrollWidth
          # is not. Also use the current A4 V2.0 DOM selectors for six feature cards and three QR routes.
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/dpro53_reaudit.py')
          s=p.read_text(encoding='utf-8')
          old="     if m['overflow']>1 or m['badHeadings'] or errors or failed:r['blockers'].append(f'RESPONSIVE:{fp.name}:{w}:{m}')"
          new="     fixed_print=fp.name in ('a4-flyer.html','quick-start.html','detailed-manual.html') and w<=820\n     if (not fixed_print and m['overflow']>1) or m['badHeadings'] or errors or failed:r['blockers'].append(f'RESPONSIVE:{fp.name}:{w}:{m}')"
          if old not in s:
              raise SystemExit('Expected responsive QA signature was not found')
          s=s.replace(old,new,1)
          old2="r['static']['a4_features']=len(a4.select('.feature'));r['static']['a4_qr_count']=len(a4.select('img.qr'))"
          new2="r['static']['a4_features']=len(a4.select('.features .f'));r['static']['a4_qr_count']=len(a4.select('.routes .route img'))"
          if old2 not in s:
              raise SystemExit('Expected A4 selector QA signature was not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/dpro53_reaudit.py
          python tools/dpro53_reaudit.py qa

      - name: Verify changed-file scope
        run: |
          set -euo pipefail
          cat > /tmp/dpro53-allowed-site.txt <<'EOF'
          site/.dpro53-reaudit-ok.txt
          site/DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_MASTER_V2.0_20260904.pdf
          site/DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_V1.0_20260902.pdf
          site/DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf
          site/DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_V1.0_20260902.pdf
          site/DPRO_LANDSCAPE_EXTERIOR_QUICK_START_MASTER_V1.1_20260904.pdf
          site/DPRO_LANDSCAPE_EXTERIOR_QUICK_START_V1.0_20260902.pdf
          site/a4-flyer.html
          site/detailed-manual.html
          site/guide-center.html
          site/landscape-consult.jpg
          site/landscape-hero.jpg
          site/lp.html
          site/product-site-v2.css
          site/qa-customer-screen.png
          site/qa-owner-screen.png
          site/qa-staff-screen.png
          site/qa-system-check-screen.png
          site/qr-demo.svg
          site/qr-guide.svg
          site/qr-line.svg
          site/qr-shop.svg
          site/qr-system-check.svg
          site/qr-tutorial.svg
          site/quick-start.html
          EOF
          sed -i 's/^          //' /tmp/dpro53-allowed-site.txt
          { git diff --name-only -- site; git ls-files --others --exclude-standard -- site; } | sort -u > /tmp/dpro53-changed-site.txt
          sort -u /tmp/dpro53-allowed-site.txt -o /tmp/dpro53-allowed-site.txt
          echo 'Changed site files:'
          cat /tmp/dpro53-changed-site.txt
          if comm -23 /tmp/dpro53-changed-site.txt /tmp/dpro53-allowed-site.txt | grep -q .; then
            echo 'ERROR: Out-of-scope site changes detected'
            comm -23 /tmp/dpro53-changed-site.txt /tmp/dpro53-allowed-site.txt
            exit 1
          fi

      - name: Verify SYSTEM Core SHA after
        run: |
          set -euo pipefail
          : > CORE_SHA_AFTER.txt
          while IFS= read -r f; do
            sha256sum "$f" >> CORE_SHA_AFTER.txt
          done < /tmp/dpro53-core-paths.txt
          if diff -u CORE_SHA_BEFORE.txt CORE_SHA_AFTER.txt > CORE_SHA_PROTECTION.txt; then
            printf '\nCORE_SHA_PROTECTION=PASS\n' >> CORE_SHA_PROTECTION.txt
          else
            cat CORE_SHA_PROTECTION.txt
            echo 'SYSTEM CORE SHA changed; aborting'
            exit 1
          fi

      - name: Build passed artifact
        run: |
          set -euo pipefail
          python tools/dpro53_reaudit.py artifact
          cp CORE_SHA_BEFORE.txt artifact-dpro53/reports/
          cp CORE_SHA_AFTER.txt artifact-dpro53/reports/
          cp CORE_SHA_PROTECTION.txt artifact-dpro53/reports/
          cp tools/dpro53_reaudit.py artifact-dpro53/reports/DPRO53_REAUDIT_EFFECTIVE_TOOL.py
          cp .github/workflows/dpro-53-final-reaudit.yml artifact-dpro53/reports/
          cp .github/workflows/dpro-53-final-reaudit-apply.yml artifact-dpro53/reports/
          printf 'WORKFLOW_EVENT=workflow_dispatch\nWORKFLOW_RUN_ID=%s\nHEAD_SHA=%s\n' '${{ github.run_id }}' '${{ github.sha }}' > artifact-dpro53/reports/WORKFLOW_DISPATCH_EVIDENCE.txt

      - name: Upload passed artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpro53-reaudit-passed
          path: artifact-dpro53
          if-no-files-found: error
          retention-days: 7
