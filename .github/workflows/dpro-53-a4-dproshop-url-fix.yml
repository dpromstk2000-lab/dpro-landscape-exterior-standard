name: DPRO 53 A4 Canonical DPRO SHOP URL Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpro-53-a4-dproshop-url-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-53-a4-dproshop-url-fix
  cancel-in-progress: false

jobs:
  fix_a4_shop_url:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Drift guard
        shell: bash
        run: |
          set -euo pipefail
          echo "START_HEAD=$(git rev-parse HEAD)"
          test "$(git hash-object site/a4-flyer.html)" = "c6718e360b4d97dd1a30b1d82c163277a67f36c6"
          echo "A4_TARGET_DRIFT=NONE"

      - name: Add visible canonical DPRO SHOP URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/a4-flyer.html")
          s = p.read_text(encoding="utf-8")

          css_old = ".route p{font-size:8px;color:#5b6d67;margin:4px 0}"
          css_new = css_old + ".route .shop-url{display:block;margin-top:3px;font-size:8px;line-height:1.15;color:#0b6f59;font-weight:900;text-decoration:none;white-space:nowrap}"
          assert s.count(css_old) == 1
          s = s.replace(css_old, css_new, 1)

          old = '<div class="route"><img src="qr-shop.svg"/><div><b>02 / DPRO SHOP公式</b><p>サービス・料金・運用の詳細。</p></div></div>'
          new = '<div class="route"><img src="qr-shop.svg"/><div><b>02 / DPRO SHOP公式</b><p>サービス・料金・運用の詳細。</p><a class="shop-url" href="https://dpro-shop.com/" target="_blank" rel="noopener">https://dpro-shop.com/</a></div></div>'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          print("DPRO_SHOP_VISIBLE_URL=ADDED")
          PY

      - name: Blocking QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("site/a4-flyer.html").read_text(encoding="utf-8")
          assert s.count('href="https://dpro-shop.com/"') == 1
          assert s.count('>https://dpro-shop.com/</a>') == 1
          assert '02 / DPRO SHOP公式' in s
          assert 'qr-shop.svg' in s
          assert 'shop-url' in s
          print("A4_VISIBLE_CANONICAL_URL=PASS")
          print("A4_URL=https://dpro-shop.com/")
          PY
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO CENTRAL"
          git config user.email "actions@users.noreply.github.com"
          git add site/a4-flyer.html
          git commit -m "fix: show canonical DPRO SHOP URL on landscape A4"
          git push origin HEAD:main

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/dpro-53-a4-dproshop-url-fix.yml
          git commit -m "chore: remove temporary DPRO 53 A4 URL fix workflow"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "DPRO 53 A4 DPRO SHOP URL FIX=PASS"
          echo "VISIBLE_URL=https://dpro-shop.com/"
          echo "CORE_REBUILD=NONE"
