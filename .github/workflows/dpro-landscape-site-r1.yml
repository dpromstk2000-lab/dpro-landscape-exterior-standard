          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/a4-flyer.html site/demo-guide.html site/landscape-demo-nav-r1.js site/qr-line-r1.png site/qr-shop-r1.png site/qr-demo-r1.png site/DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_MASTER_V2.1_20261127.pdf site/index.html site/customer.html site/staff.html site/owner.html site/product-site.html site/official-site.html site/lp.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'DPRO LANDSCAPE SITE R1'
          git push origin HEAD:main
      - name: Dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
