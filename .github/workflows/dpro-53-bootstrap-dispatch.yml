name: DPRO 53 Bootstrap Dispatch

# CENTRAL FIX R1 canonical Japanese-wrap + LIVE visual evidence QA applied.
on:
  push:
    branches: [main]
    paths:
      - 'tools/dpro53_central_fix_r1.py'
      - '.github/workflows/dpro-53-central-fix-r1.yml'
      - '.github/workflows/dpro-53-central-fix-r1-apply.yml'
      - '.github/workflows/dpro-53-bootstrap-dispatch.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: dpro-53-bootstrap-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Dispatch and wait for CENTRAL FIX R1 audit
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo='dpromstk2000-lab/dpro-landscape-exterior-standard'
          gh workflow run dpro-53-central-fix-r1.yml -R "$repo" --ref main
          audit_id=''
          for i in $(seq 1 40); do
            audit_id="$(gh run list -R "$repo" --workflow dpro-53-central-fix-r1.yml --branch main --limit 30 --json databaseId,headSha,event | jq -r --arg sha "$EXPECTED_SHA" '[.[] | select(.headSha==$sha and .event=="workflow_dispatch")][0].databaseId // empty')"
            if [ -n "$audit_id" ]; then break; fi
            sleep 3
          done
          test -n "$audit_id"
          echo "Audit run: $audit_id"
          gh run watch "$audit_id" -R "$repo" --exit-status
          conclusion="$(gh run view "$audit_id" -R "$repo" --json conclusion -q .conclusion)"
          test "$conclusion" = 'success'
          echo "audit_run_id=$audit_id" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for audited CENTRAL FIX R1 apply chain
        id: apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_RUN_ID: ${{ steps.audit.outputs.audit_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo='dpromstk2000-lab/dpro-landscape-exterior-standard'
          gh workflow run dpro-53-central-fix-r1-apply.yml -R "$repo" --ref main -f audited_run_id="$AUDIT_RUN_ID"
          apply_id=''
          for i in $(seq 1 40); do
            apply_id="$(gh run list -R "$repo" --workflow dpro-53-central-fix-r1-apply.yml --branch main --limit 30 --json databaseId,headSha,event | jq -r --arg sha "$EXPECTED_SHA" '[.[] | select(.headSha==$sha and .event=="workflow_dispatch")][0].databaseId // empty')"
            if [ -n "$apply_id" ]; then break; fi
            sleep 3
          done
          test -n "$apply_id"
          echo "Apply run: $apply_id"
          gh run watch "$apply_id" -R "$repo" --exit-status
          conclusion="$(gh run view "$apply_id" -R "$repo" --json conclusion -q .conclusion)"
          test "$conclusion" = 'success'
          echo "apply_run_id=$apply_id" >> "$GITHUB_OUTPUT"

      - name: Final chain summary
        run: |
          set -euo pipefail
          echo 'DPRO 53 CENTRAL FIX R1 chain completed successfully.'
          echo 'Audit run: ${{ steps.audit.outputs.audit_run_id }}'
          echo 'Apply run: ${{ steps.apply.outputs.apply_run_id }}'
