name: DPRO 53 Support Sync V1.2.2 QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/guide-center.html'
      - 'site/quick-start.html'
      - 'site/detailed-manual.html'
      - 'presentation-qa/support-sync-v1.2.2/support_sync_qa.mjs'
      - 'presentation-qa/support-sync-v1.2.2/build_pdfs.mjs'
      - 'presentation-qa/support-sync-v1.2.2/finalize_support_sync.py'
      - '.github/workflows/dpro-53-support-sync-v122-qa.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dpro-53-support-sync-v122-qa
  cancel-in-progress: true

env:
  START_HEAD: c8071ad4656eda253313fbe99c75994b23925bb0
  DPRO_BASE_URL: https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/
  RETURN_NAME: DPRO_53_LANDSCAPE_EXTERIOR_SUPPORT_SYNC_V1.2.2_RETURN_20260905.zip

jobs:
  support_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify scope and frozen baseline
        run: |
          set -euo pipefail
          git diff --name-only "$START_HEAD"..HEAD | tee /tmp/changed.txt
          while IFS= read -r f; do
            case "$f" in
              site/guide-center.html|site/quick-start.html|site/detailed-manual.html|site/DPRO_LANDSCAPE_EXTERIOR_QUICK_START_MASTER_V1.2.2_20260905.pdf|site/DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_MASTER_V1.2.2_20260905.pdf|presentation-qa/support-sync-v1.2.2/*|.github/workflows/dpro-53-support-sync-v122-qa.yml) ;;
              *) echo "UNPERMITTED CHANGE: $f"; exit 1;;
            esac
          done < /tmp/changed.txt
          test "$(git rev-parse HEAD:site/tutorial.html)" = 6e464117b363bec16bbe99644b1e1c6cad9e7312
          test "$(git rev-parse HEAD:site/index.html)" = 4fa71bfbb41562a5226221a75a2b6351e830008d
          test "$(git rev-parse HEAD:site/owner.html)" = d55da6f9a3cbbcae6f74285e22df603d0afa2758
          test "$(git rev-parse HEAD:site/staff.html)" = 9012ba0800f7cd19350e343d6b1511804a6a803c
          test "$(git rev-parse HEAD:site/customer.html)" = 04e4902c11cc4d6491f97fd4224b4e07d933adce
          test "$(git rev-parse HEAD:site/system-check.html)" = 9033ac33af6570064c51cded566e4fa54628c808
          test "$(git rev-parse HEAD:site/app-core.js)" = a907e05db641b23bd39162263191e51240d9d868
          test "$(git rev-parse HEAD:site/app.css)" = 4365341d0cd17d85374ce813a5a27341cf83e3d0
          test "$(git rev-parse HEAD:site/auth-client.js)" = 80567163fe5c332f8fbe7223ab7908e141f0d10e
          test "$(git rev-parse HEAD:site/config.js)" = e69818433b0568f5bec1b3e9e65d3967ae6003de
          test "$(git rev-parse HEAD:worker/worker.js)" = 983df0e93feecb15f9613f939d6d264997b740a5
          test "$(git rev-parse HEAD:schema.sql)" = c930aafcc941e98cb4933a9ba284c334ae9ac40a
          test "$(git rev-parse HEAD:site/DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_MASTER_V2.0_20260904.pdf)" = ed5c5c330c8ef51562b8809b461099b9cef1efa3
          test "$(grep -o 'data-page=' site/quick-start.html | wc -l)" -eq 3
          test "$(grep -o 'data-page=' site/detailed-manual.html | wc -l)" -eq 10
          node --check presentation-qa/support-sync-v1.2.2/support_sync_qa.mjs
          node --check presentation-qa/support-sync-v1.2.2/build_pdfs.mjs
          python3 -m py_compile presentation-qa/support-sync-v1.2.2/finalize_support_sync.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install runtime PDF QA tools
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y poppler-utils zbar-tools fonts-noto-cjk >/dev/null
          python3 -m pip install --quiet pillow

      - name: Capture fresh Pages runtime and Guide/Tutorial QA
        run: node presentation-qa/support-sync-v1.2.2/support_sync_qa.mjs

      - name: Build final Quick and Detailed PDFs
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/dpro53-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/site/quick-start.html >/dev/null && break; sleep 1; done
          node presentation-qa/support-sync-v1.2.2/build_pdfs.mjs
          kill $pid || true
          trap - EXIT

      - name: Render every PDF page, decode every QR, content and freeze QA
        run: python3 presentation-qa/support-sync-v1.2.2/finalize_support_sync.py pre

      - name: Commit generated PDFs and fresh screenshots
        run: |
          set -euo pipefail
          git config user.name 'dpromstk2000-lab'
          git config user.email 'dpromstk2000@gmail.com'
          git add site/DPRO_LANDSCAPE_EXTERIOR_QUICK_START_MASTER_V1.2.2_20260905.pdf \
                  site/DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_MASTER_V1.2.2_20260905.pdf \
                  presentation-qa/support-sync-v1.2.2/screens/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'DPRO 53 Support Sync V1.2.2 generated PDFs and screenshots'
            git push origin HEAD:main
          fi
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload final site to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy final site to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify final main and deployed PDF hashes
        run: |
          set -euo pipefail
          out='presentation-qa/support-sync-v1.2.2/runtime-output'
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$FINAL_HEAD"
          q='site/DPRO_LANDSCAPE_EXTERIOR_QUICK_START_MASTER_V1.2.2_20260905.pdf'
          d='site/DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_MASTER_V1.2.2_20260905.pdf'
          qsha="$(sha256sum "$q" | awk '{print $1}')"; dsha="$(sha256sum "$d" | awk '{print $1}')"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "${DPRO_BASE_URL}guide-center.html?v=$FINAL_HEAD" -o /tmp/g.html \
              && grep -q 'GUIDE CENTER V1.2.2' /tmp/g.html \
              && curl -fsS "${DPRO_BASE_URL}DPRO_LANDSCAPE_EXTERIOR_QUICK_START_MASTER_V1.2.2_20260905.pdf?v=$FINAL_HEAD" -o /tmp/q.pdf \
              && curl -fsS "${DPRO_BASE_URL}DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_MASTER_V1.2.2_20260905.pdf?v=$FINAL_HEAD" -o /tmp/d.pdf; then
              test "$(sha256sum /tmp/q.pdf | awk '{print $1}')" = "$qsha" && test "$(sha256sum /tmp/d.pdf | awk '{print $1}')" = "$dsha" && { ok=1; break; }
            fi
            sleep 3
          done
          test "$ok" -eq 1
          cat > "$out/PAGES_EVIDENCE.txt" <<TXT
          PAGES=PASS
          FINAL_HEAD=$FINAL_HEAD
          DEPLOYMENT_URL=${{ steps.deployment.outputs.page_url }}
          GUIDE_URL=${DPRO_BASE_URL}guide-center.html
          QUICK_URL=${DPRO_BASE_URL}DPRO_LANDSCAPE_EXTERIOR_QUICK_START_MASTER_V1.2.2_20260905.pdf
          DETAILED_URL=${DPRO_BASE_URL}DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_MASTER_V1.2.2_20260905.pdf
          QUICK_SHA256=$qsha
          DETAILED_SHA256=$dsha
          TXT
          cat > "$out/WORKFLOW_PAGES_RESULT.txt" <<TXT
          SUPPORT_SYNC_BLOCKING_STEPS=PASS
          PAGES=PASS
          WORKFLOW_RUN_ID=$GITHUB_RUN_ID
          WORKFLOW_RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          FINAL_HEAD=$FINAL_HEAD
          DIRECT_PAGES_DEPLOY=PASS
          TXT

      - name: Build flat CENTRAL return ZIP
        run: python3 presentation-qa/support-sync-v1.2.2/finalize_support_sync.py package

      - name: Upload final return ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dpro53-support-sync-v122-return
          path: ${{ env.RETURN_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dpro53-support-sync-v122-diagnostics
          path: presentation-qa/support-sync-v1.2.2/runtime-output
          if-no-files-found: ignore
          retention-days: 14
